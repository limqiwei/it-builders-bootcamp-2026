<style>

    content div, p, label, input {
        font-family: "Press Start 2P", system-ui;
        font-weight: 400;
        font-style: normal;
    }
    
    .container {
        position: relative;
        width: auto;
        height: 200px;
    }

    .secret {
        position: absolute;
        top: 0;
        display: flex;
        flex-flow: column;
        align-items: center;
        justify-content: center;
        inset: 0;
        z-index: 1;
    }

    div.backdrop {
        position: absolute;
        top: 0;
        border: 1px solid grey;
        border-radius: 5px;    
        background-color: black;
        inset: 0;
        z-index: 2;
    }

    #color-board {
        display: flex;
        gap: 10px;
        flex-direction: column;
        align-items: center;
        background-color: greenyellow;
        border: 1px solid black;
        border-radius: 5px;    
        width: auto;
        margin: 10px 0;
        padding: 20px;
    }

    .color-control {
        display: flex;
        flex-direction: row;
        min-width: 250px;
    }

    .color-control label {
        flex: 1;
        color: black;
        font-weight: bold;
    }

    .color-control input {
        flex: 2;
        width: 30;
    }

</style>
<div class="content">
    <div class="container">
        <div class="backdrop"></div>
        <div class="secret"><p>Yay you found me!</p></div>
    </div>
    <div id='color-board'>
        <div class="color-control">
            <label for="red-meter">Red</label>
            <input id="red-meter" type='range' min="0" max="255" step="1" value="0">
        </div>
        <div class="color-control">
            <label for="green-meter">Green</label>
            <input id="green-meter" type='range' min="0" max="255" step="1" value="0">
        </div>
        <div class="color-control">
            <label for="blue-meter">Blue</label>
            <input id="blue-meter" type='range' min="0" max="255" step="1" value="0">
        </div>
        <div class="color-control">
            <label for="alpha-meter">Alpha</label>
            <input id="alpha-meter" type='range' min="0" max="1" step="0.1" value="1">
        </div>
    </div>
</div>

<script>
    function mixTheColors() {
        let red = document.getElementById('red-meter').value;
        let blue = document.getElementById('blue-meter').value;
        let green = document.getElementById('green-meter').value;
        let alpha = document.getElementById('alpha-meter').value;

        document.querySelector('div.backdrop').style.backgroundColor = `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }
    
    document.querySelectorAll('.color-control > input').forEach(function(element, index, array) {
        element.addEventListener('input', function(event) {
            mixTheColors()
        });
    });

    
</script>
