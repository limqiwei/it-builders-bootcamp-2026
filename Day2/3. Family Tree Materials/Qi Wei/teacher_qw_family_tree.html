<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <!-- This sets the title of your browser tab. Change it to see what happens -->
  <title>Family Tree</title>

  <!-- We are loading the tools and code to help us get started quickly -->
  <link rel="stylesheet" href="https://rawcdn.githack.com/jtzs/it-builders-bootcamp-2026/refs/heads/main/Day2/2_final_project_family_tree/tools/family-chart.css">
  <script src="https://rawcdn.githack.com/jtzs/it-builders-bootcamp-2026/refs/heads/main/Day2/2_final_project_family_tree/tools/d3.js"></script>
  <script src="https://rawcdn.githack.com/jtzs/it-builders-bootcamp-2026/refs/heads/main/Day2/2_final_project_family_tree/tools/family-chart.js"></script>
  <script src="https://rawcdn.githack.com/jtzs/it-builders-bootcamp-2026/refs/heads/main/Day2/2_final_project_family_tree/tools/export_helper.js"></script>
  

  <!-- This is where we put our CSS styles -->
  <style>
  
  #toolbar { 
	min-height: 44px; 
	background: #1a6b56;
	margin: -8px;
	color: white; 

	font-weight: bold;
  }
  
  #toolbar .eh-status {
	color: white;
	font-size: 25px;
	
  }
  
  #toolbar button, .eh-toolbar button, .eh-toolbar label {
	font-size: 25px !important;
  }

  /* This sets that font for all items within the <body> tag. */
  body {
    font-family: Roboto;
  }

  .f3 {
    --background-color: white;
    --text-color: black;
  }

  /*
  This adjust the style for the background of the male card.
  Change the background color to your desired color for male member cards.
  */
  .f3 div.card-male .card-inner, .f3 div.card-male .person-icon svg {
      background-color: #48b57f; 
      color: white;
  }

  .f3 div.card-main .card-inner {
    outline: 4px solid yellow;
  }

  /* 
  This adjust the style for the background of the female card.
  Change the background color to your desired color for female member cards.
  */
  .f3 div.card-female .card-inner, .f3 div.card-female .person-icon svg {
      background-color: #c52a9c;
      color: white;
  }

  /* This sets the style for the family tree canvas 
  - rgba stands for red, green, blue, alpha.
  - alpha just means how 'transparent it looks like'. alpha is given a value from 0 to 1. 
    0 means transparent and 1 is means it is not transparent.
  */
  #f3Canvas {
    background-color: rgba(245, 245, 220, 0.7);
    border-radius: 12px;
    border: 1px dotted grey;
  }

  /* Changes the family relationship color and width */ 
  .f3 .links_view path.link {
    stroke: purple;
    stroke-width: 5px;
  }
  </style>
</head>
<body>
  <div id="toolbar"></div>  
  <h1 id="title" style='text-align: center; padding: 20px; text-transform: uppercase; color: black;'>Teacher Qi Wei's Family Tree</h1>
  <div id="FamilyChart" class="f3" style="width:90%;height:500px;margin:auto;"></div>
  <script>  
  // The toolbar goes up first, on its own, so that a failure further down cannot
  // take it with it - and so a missing export_helper.js is loud, not silent.
  const helper = typeof ExportHelper === 'undefined' ? null : ExportHelper

  if (helper) {
    helper.init({
      storageKey: 'family-tree-demo',
      exportPrefix: 'family-tree',
      mount: '#toolbar'
    })
  } else {
    document.getElementById('toolbar').textContent =
      'export_helper.js did not load - check it sits next to index.html.'
    console.error('export_helper.js did not load')
  }

  </script>
  <script>
    // This is a sample data to help you.
    const SAMPLE = [
      {
        "id": "1",
        "data": {"first name": "Me", "last name": "", "birthday": "1998", "gender": "M"},
        "rels": {"parents": ["2", "3"]}
      },
      {
        "id": "2",
        "data": {"first name": "Dad", "last name": "", "birthday": "1961", "gender": "M"},
        "rels": {"children": ["1"], "spouses": ["3"]}
      },
      {
        "id": "3",
        "data": {"first name": "Mom", "last name": "", "birthday": "1964", "gender": "F"},
        "rels": {"children": ["1"], "spouses": ["2"]}
      }
    ]

    const f3Chart = f3.createChart('#FamilyChart', SAMPLE)

    // Siblings are not stored - the library works them out from shared parents -
    // and it only draws them for the currently focused card, off by default.
    f3Chart
    .setShowSiblingsOfMain(true)
    .setCardXSpacing(150)
    .setCardYSpacing(200)

    const card = f3Chart.setCardHtml()
      .setStyle('imageCircle')
      .setCardDisplay([
        ["first name","last name"],
        ["birthday"],
        ["favourite food",],
        ["hobby",],

      ]);

    // createChart on its own is a viewer. This is what makes it editable: click a
    // card and a form opens, with its own add-relative and delete buttons.
    // Add a line to the list and every person grows that field.
    const editTree = f3Chart.editTree()
      .fixed()
      .setFields([
        { id: 'first name', type: 'text',     label: 'First name' },
        { id: 'last name',  type: 'text',     label: 'Last name' },
        { id: 'birthday',   type: 'text',     label: 'Birthday' },
        { id: 'about',      type: 'textarea', label: 'About them' },
        { id: 'avatar',      type: 'text', label: 'Avatar' },
        { id: 'favourite food',   type: 'text',     label: 'Favourite Food' },
        { id: 'hobby',   type: 'text',     label: 'Hobby' },
      ])
      .setEditFirst(true);

    editTree.setEdit()
    editTree.setCardClickOpen(card)

    // Everything about saving, exporting and importing lives in export_helper.js.
    // It reads this chart and writes back to it; it never builds one. Handing it
    // the edit form is what turns on save-on-every-edit.
    const saved = helper ? helper.setChart(f3Chart, editTree).load() : null

    if (saved) {
      helper.apply(saved.data, saved.mainId)   // redraws for us
      helper.setStatus('Loaded the tree saved in this browser.')
    } else {
      f3Chart.updateTree({initial: true})
    }

    (() => {


      // This will change the background image of your website.
      // Try changing the url below
      function changeBackground() {
        var url = 'https://cdn.photoroom.com/v2/image-cache?path=gs://background-7ef44.appspot.com/backgrounds_v3/cartoon/46_cartoon.jpg'

        // Example 1 - https://cdn.photoroom.com/v2/image-cache?path=gs://background-7ef44.appspot.com/backgrounds_v3/cartoon/46_cartoon.jpg;
        // Example 2 - https://image.slidesdocs.com/responsive-images/background/blue-green-country-mountain-hill-rustic-beautiful-cartoon-powerpoint-background_ece11020af__960_540.jpg


        document.body.style.backgroundImage = `url(${url})`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundRepeat = 'no-repeat'
      }

      // Run these actions below when the page loads.
      changeBackground();
    })()
  </script>
</body>
</html>
